# Include inside the existing HTTPS server block, before its locations.
if (-f /var/lib/memos-update/maintenance) {
    return 503;
}
error_page 503 @memos_maintenance;
location @memos_maintenance {
    add_header X-Memos-Maintenance "1" always;
    add_header Retry-After "60" always;
    add_header Cache-Control "no-store" always;
    return 503 "Memos is updating. Please retry shortly.\n";
}
