name: Publish Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged Version Packages PR number to retry
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  packages: read
  actions: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'Castor6/memos' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'changeset-release/main'))
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/github-script@v8
        id: source
        env:
          RELEASE_PR: ${{ inputs.release_pr || github.event.pull_request.number }}
        with:
          script: |
            if (!/^[1-9]\d*$/.test(process.env.RELEASE_PR)) throw Error('Invalid PR number');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.RELEASE_PR)});
            if (!pr.merged || pr.base.ref !== 'main' || pr.head.ref !== 'changeset-release/main' ||
                pr.head.repo?.full_name !== context.payload.repository.full_name ||
                !['github-actions[bot]', context.repo.owner].includes(pr.user.login) ||
                !/^[a-f0-9]{40}$/.test(pr.merge_commit_sha)) throw Error('Expected a merged, trusted version PR');
            core.setOutput('commit', pr.merge_commit_sha);
  plan:
    needs: source
    runs-on: ubuntu-latest
    outputs:
      memos: ${{ steps.plan.outputs.memos }}
      web_clipper: ${{ steps.plan.outputs.web_clipper }}
      legacy_web_clipper: ${{ steps.plan.outputs.legacy_web_clipper }}
      independent: ${{ steps.plan.outputs.independent }}
      memos_version: ${{ steps.plan.outputs.memos_version }}
      clipper_version: ${{ steps.plan.outputs.clipper_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.0.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify generated version diff
        run: |
          pnpm install --frozen-lockfile
          RELEASE_BASE="$(git rev-parse HEAD^)" VERSION_PR=true pnpm check:release
      - name: Route only changed release versions
        id: plan
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync, existsSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8'}).trim();
          const version = (file) => {
            const value = JSON.parse(readFileSync(file, 'utf8')).version;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(value)) throw Error('Invalid release version');
            return value;
          };
          const changed = (file, current) => {
            const previous = git('ls-tree', 'HEAD^', '--', file);
            if (!previous) throw Error('Release version metadata must exist before the version PR');
            return JSON.parse(git('show', `HEAD^:${file}`)).version !== current;
          };
          const memosVersion = version('package.json');
          const memos = changed('package.json', memosVersion);
          const clipperFile = 'extensions/web-clipper/release/package.json';
          const independent = existsSync(clipperFile);
          const clipperVersion = independent ? version(clipperFile) : memosVersion;
          const clipper = independent && changed(clipperFile, clipperVersion);
          if (!memos && !clipper) throw Error('No changed release version');
          if ((memos && memosVersion === '0.0.0') || (clipper && ['0.0.0', '0.0.1'].includes(clipperVersion))) throw Error('Cannot publish a placeholder');
          const outputs = {
            memos, web_clipper: clipper, independent,
            legacy_web_clipper: memos && !independent && existsSync('extensions/web-clipper/scripts/package-release.py'),
            memos_version: memosVersion, clipper_version: clipperVersion,
          };
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs).map(([key, value]) => `${key}=${value}\n`).join(''));
          JS
  candidate:
    needs: [source, plan]
    if: needs.plan.outputs.memos == 'true'
    outputs:
      version: ${{ needs.plan.outputs.memos_version }}
      artifact_name: memos-${{ needs.plan.outputs.memos_version }}-${{ needs.source.outputs.commit }}-attempt-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: read
      actions: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted publication tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .publication-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.0.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
      - name: Test release tooling
        run: |
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_publish*.py'
      - uses: pnpm/action-setup@v4.2.0
        if: needs.plan.outputs.legacy_web_clipper == 'true'
        with:
          version: 11.10.0
          package_json_file: extensions/web-clipper/package.json
      - name: Check and build the web clipper
        if: needs.plan.outputs.legacy_web_clipper == 'true'
        working-directory: extensions/web-clipper
        run: |
          cp .env.example .env
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          python3 -m unittest discover -s scripts -p 'test_package*.py'
          pnpm build
      - name: Package the versioned Chromium extension
        if: needs.plan.outputs.legacy_web_clipper == 'true'
        run: python3 extensions/web-clipper/scripts/package-release.py --output build/candidate
      - uses: pnpm/action-setup@v4.2.0
        if: needs.plan.outputs.legacy_web_clipper == 'true'
        with:
          version: 11.0.1
          package_json_file: package.json
      # Embedding the main frontend modifies a tracked placeholder, so package the
      # extension from the clean source tree before running the main web release.
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm release
      - name: Build versioned Linux candidates
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.memos_version }}
          WEB_CLIPPER: ${{ needs.plan.outputs.legacy_web_clipper }}
          WEB_CLIPPER_VERSION: ${{ needs.plan.outputs.clipper_version }}
          INDEPENDENT_RELEASE: ${{ needs.plan.outputs.independent }}
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p build/candidate
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/usememos/memos/internal/version.Version=$RELEASE_VERSION -X github.com/usememos/memos/internal/version.Commit=$RELEASE_COMMIT" \
              -o "build/candidate/memos-linux-$arch" ./cmd/memos
          done
          cp CHANGELOG.md LICENSE build/candidate/
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          const release = {version, tag: `castor-v${version}`, commit: process.env.RELEASE_COMMIT};
          // Old checkouts retain their original artifact schema and publisher.
          if (process.env.INDEPENDENT_RELEASE === 'true') release.component = 'memos';
          if (process.env.WEB_CLIPPER === 'true') {
            const extensionVersion = process.env.WEB_CLIPPER_VERSION;
            release.webClipper = {version: extensionVersion, file: `memos-web-clipper-chromium-v${extensionVersion}.zip`};
          }
          writeFileSync('build/candidate/release.json', JSON.stringify(release, null, 2) + '\n');
          JS
          (cd build/candidate && sha256sum memos-linux-* release.json CHANGELOG.md LICENSE > SHA256SUMS)
          if [ "$WEB_CLIPPER" = 'true' ]; then
            (cd build/candidate && sha256sum "memos-web-clipper-chromium-v$WEB_CLIPPER_VERSION.zip" >> SHA256SUMS)
          fi
      - name: Install registry transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Build and test one immutable image
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_IMAGE: ghcr.io/castor6/memos
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_IMAGE: ${{ vars.ACR_IMAGE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: python3 .publication-tools/scripts/publish-image.py prepare
      - uses: actions/upload-artifact@v6
        id: candidate-artifact
        with:
          name: memos-${{ needs.plan.outputs.memos_version }}-${{ needs.source.outputs.commit }}-attempt-${{ github.run_attempt }}
          path: build/candidate/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Record durable candidate receipt before any registry upload
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate-artifact.outputs.artifact-id }}
        run: python3 .publication-tools/scripts/publish-image.py receipt

  registry:
    needs: [source, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        channel: [acr, ghcr]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Check out trusted publication tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .publication-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: build/candidate/
      - name: Install registry transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Publish this channel independently
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_IMAGE: ghcr.io/castor6/memos
          ACR_IMAGE: ${{ vars.ACR_IMAGE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          CHANNEL: ${{ matrix.channel }}
        run: python3 .publication-tools/scripts/publish-image.py publish --channel "$CHANNEL"
      - uses: actions/upload-artifact@v6
        with:
          name: published-${{ matrix.channel }}
          overwrite: true
          path: build/result/
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: [source, candidate, registry]
    if: always() && needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Check out trusted publication tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .publication-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: build/candidate/
      - uses: actions/download-artifact@v6
        with:
          pattern: published-*
          path: build/published/
      - name: Require at least one successful channel
        run: python3 .publication-tools/scripts/publication-summary.py
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 .publication-tools/scripts/publish-github-release.py

  clipper-candidate:
    needs: [source, plan]
    if: needs.plan.outputs.web_clipper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.10.0
          package_json_file: extensions/web-clipper/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: extensions/web-clipper/pnpm-lock.yaml
      - name: Check and build the independent web clipper
        working-directory: extensions/web-clipper
        run: |
          cp .env.example .env
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          python3 -m unittest discover -s scripts -p 'test_package*.py'
          pnpm build
      - name: Prepare verified extension candidate
        run: |
          python3 -m unittest discover -s scripts -p 'test_publish_github_release.py'
          python3 extensions/web-clipper/scripts/package-release.py --output build/web-clipper
          python3 scripts/publish-github-release.py stage-web-clipper
      - uses: actions/upload-artifact@v6
        with:
          name: web-clipper-${{ needs.plan.outputs.clipper_version }}-${{ needs.source.outputs.commit }}
          path: build/web-clipper/
          overwrite: true
          retention-days: 30
          if-no-files-found: error

  clipper-release:
    needs: [source, plan, clipper-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: web-clipper-${{ needs.plan.outputs.clipper_version }}-${{ needs.source.outputs.commit }}
          path: build/web-clipper/
      - name: Publish verified extension Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
          RELEASE_COMPONENT: web-clipper
        run: python3 scripts/publish-github-release.py
