name: Publish Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged Version Packages PR number to retry
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'Castor6/memos' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'changeset-release/main'))
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/github-script@v8
        id: source
        env:
          RELEASE_PR: ${{ inputs.release_pr || github.event.pull_request.number }}
        with:
          script: |
            if (!/^[1-9]\d*$/.test(process.env.RELEASE_PR)) throw Error('Invalid PR number');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.RELEASE_PR)});
            if (!pr.merged || pr.base.ref !== 'main' || pr.head.ref !== 'changeset-release/main' ||
                pr.head.repo?.full_name !== context.payload.repository.full_name ||
                !['github-actions[bot]', context.repo.owner].includes(pr.user.login) ||
                !/^[a-f0-9]{40}$/.test(pr.merge_commit_sha)) throw Error('Expected a merged, trusted version PR');
            core.setOutput('commit', pr.merge_commit_sha);
  candidate:
    needs: source
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.0.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
      - name: Verify generated version diff
        run: |
          pnpm install --frozen-lockfile
          RELEASE_BASE="$(git rev-parse HEAD^)" VERSION_PR=true pnpm check:release
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_publish*.py'
      - name: Read the personal version
        id: version
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || version === '0.0.0') throw Error('Invalid release version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm release
      - name: Build versioned Linux candidates
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p build/candidate
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/usememos/memos/internal/version.Version=$RELEASE_VERSION -X github.com/usememos/memos/internal/version.Commit=$RELEASE_COMMIT" \
              -o "build/candidate/memos-linux-$arch" ./cmd/memos
          done
          cp CHANGELOG.md LICENSE build/candidate/
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          writeFileSync('build/candidate/release.json', JSON.stringify({version, tag: `castor-v${version}`, commit: process.env.RELEASE_COMMIT}, null, 2) + '\n');
          JS
          (cd build/candidate && sha256sum memos-linux-* release.json CHANGELOG.md LICENSE > SHA256SUMS)
      - name: Test and publish immutable image, then advance stable
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_IMAGE: ${{ vars.ACR_IMAGE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: python3 scripts/publish-image.py
      - uses: actions/upload-artifact@v6
        with:
          name: memos-${{ steps.version.outputs.version }}-${{ needs.source.outputs.commit }}
          path: build/candidate/
          retention-days: 30
          if-no-files-found: error

  github-release:
    needs: [source, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: memos-${{ needs.candidate.outputs.version }}-${{ needs.source.outputs.commit }}
          path: build/candidate/
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 scripts/publish-github-release.py
