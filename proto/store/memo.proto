syntax = "proto3";

package memos.store;

option go_package = "gen/store";

message MemoPayload {
  Property property = 1;

  Location location = 2;

  repeated string tags = 3;

  // Promoted to indexed database columns; never reuse these payload fields.
  reserved 4, 5;
  reserved "space", "is_todo";
  // Explicit tags must not be overwritten by Markdown extraction.
  bool explicit_tags = 6;

  // Immutable source snapshot from the personal web clipper.
  MemoCapture capture = 7;

  // The calculated properties from the memo content.
  message Property {
    bool has_link = 1;
    bool has_task_list = 2;
    bool has_code = 3;
    bool has_incomplete_tasks = 4;
    // The title extracted from the first H1 heading, if present.
    string title = 5;
  }

  message Location {
    string placeholder = 1;
    double latitude = 2;
    double longitude = 3;
  }
}

message MemoCapture {
  string kind = 1;
  string platform = 2;
  string source_url = 3;
  string source_id = 4;
  string comment = 5;
  string context = 6;
  repeated Post posts = 7;

  message Post {
    string id = 1;
    string url = 2;
    string author = 3;
    string author_name = 4;
    string content = 5;
    string published_at = 6;
    repeated string images = 7;
  }
}
