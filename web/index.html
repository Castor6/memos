<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="memos-build-id" content="__MEMOS_BUILD_ID__" />
    <script id="startup-appearance">
      (() => {
        let theme = "system";
        let previousBuild = "";
        try {
          theme = localStorage.getItem("memos-theme") || theme;
          previousBuild = localStorage.getItem("memos-successful-build") || "";
        } catch {
          // An unavailable version record keeps the full startup screen.
        }
        const themes = ["system", "default", "default-dark", "paper", "cream", "mint", "flomo"];
        if (!themes.includes(theme)) theme = "system";
        if (theme === "system") theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "default-dark" : "default";
        document.documentElement.dataset.theme = theme;
        const buildId = document.querySelector('meta[name="memos-build-id"]').content;
        const feedRoute = /^\/(?:home\/?|todos\/?)?$/.test(window.location.pathname);
        const warm = feedRoute && /^[a-f0-9]{64}$/.test(buildId) && previousBuild === buildId;
        document.documentElement.dataset.startupMode = warm ? "warm" : "cold";
      })();
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style id="startup-style">
      #root[inert] { position: fixed; inset: 0; overflow: hidden; visibility: hidden; }
      #startup-screen {
        --startup-bg: #faf9f5;
        --startup-paper: #ffffff;
        --startup-ink: #24272e;
        --startup-muted: #767b80;
        --startup-edge: #dce8dc;
        --startup-green: #25c769;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        overflow: auto;
        background: var(--startup-bg);
        color: var(--startup-ink);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      html[data-theme="default-dark"] #startup-screen {
        --startup-bg: #1d1f23;
        --startup-paper: #2b3034;
        --startup-ink: #eceeec;
        --startup-muted: #b0b6b2;
        --startup-edge: #455549;
        --startup-green: #53d38b;
        color-scheme: dark;
      }
      html[data-theme="paper"] #startup-screen { --startup-bg: #f5ede4; }
      html[data-theme="cream"] #startup-screen { --startup-bg: #fcf9f5; }
      html[data-theme="mint"] #startup-screen { --startup-bg: #f1f8f3; }
      html[data-theme="flomo"] #startup-screen { --startup-bg: #f8f8f8; }
      #startup-screen .startup-content { width: min(100%, 320px); margin: auto; }
      #startup-screen .startup-papers {
        position: relative;
        width: 112px;
        height: 132px;
        margin: 0 auto 30px;
        animation: startup-float 3.6s ease-in-out infinite;
      }
      #startup-screen .startup-paper {
        position: absolute;
        inset: 0;
        border: 1px solid var(--startup-edge);
        border-radius: 13px;
        background: var(--startup-paper);
        box-shadow: 0 5px 12px #142d1a0a;
      }
      #startup-screen .startup-paper:first-child { transform: translate(-9px, 5px) rotate(-10deg); }
      #startup-screen .startup-paper:nth-child(2) { transform: translate(10px, 3px) rotate(8deg); }
      #startup-screen .startup-paper:last-child {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transform: rotate(3deg);
        box-shadow: 0 8px 16px #142d1a0e;
      }
      #startup-screen .startup-logo { width: 54px; height: 54px; border-radius: 50%; margin-bottom: 3px; }
      #startup-screen .startup-line { width: 65px; height: 4px; border-radius: 4px; background: var(--startup-edge); }
      #startup-screen .startup-line:last-child { width: 40px; }
      #startup-screen .startup-title { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: -0.6px; }
      #startup-screen .startup-dots { height: 28px; display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 9px; }
      #startup-screen .startup-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--startup-green); animation: startup-dot 1.5s ease-in-out infinite; }
      #startup-screen .startup-dot:nth-child(2) { animation-delay: 180ms; }
      #startup-screen .startup-dot:nth-child(3) { animation-delay: 360ms; }
      #startup-screen .startup-status { margin: 8px 0 0; color: var(--startup-muted); }
      #startup-screen .startup-recovery { margin-top: 20px; }
      #startup-screen .startup-recovery[hidden] { display: none; }
      #startup-screen .startup-retry {
        border: 1px solid var(--startup-edge);
        border-radius: 8px;
        padding: 8px 16px;
        background: var(--startup-paper);
        color: var(--startup-ink);
        font: inherit;
        cursor: pointer;
      }
      #startup-screen .startup-retry:focus-visible { outline: 2px solid var(--startup-green); outline-offset: 3px; }
      #startup-screen .startup-shell { display: none; }
      html[data-startup-mode="warm"] #startup-screen { display: block; padding: 0; overflow: hidden; }
      html[data-startup-mode="warm"] #startup-screen .startup-brand { display: none; }
      html[data-startup-mode="warm"] #startup-screen .startup-content {
        position: absolute;
        left: 320px;
        right: 0;
        bottom: max(24px, env(safe-area-inset-bottom));
        width: auto;
        padding: 12px 24px;
        box-sizing: border-box;
        background: var(--startup-bg);
      }
      html[data-startup-mode="warm"] #startup-screen .startup-shell {
        --shell-block: color-mix(in srgb, var(--startup-ink) 8%, transparent);
        display: flex;
        min-height: 100%;
        text-align: left;
        pointer-events: none;
        user-select: none;
      }
      #startup-screen .shell-nav {
        flex: 0 0 64px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 28px 12px;
        border-right: 1px solid var(--startup-edge);
      }
      #startup-screen .shell-nav span { width: 24px; height: 24px; border-radius: 7px; background: var(--shell-block); }
      #startup-screen .shell-nav span:first-child { width: 30px; height: 30px; border-radius: 50%; }
      #startup-screen .shell-sidebar {
        flex: 0 0 256px;
        box-sizing: border-box;
        padding: 29px 16px;
        border-right: 1px solid var(--startup-edge);
      }
      #startup-screen .shell-line { display: block; width: 72%; height: 8px; margin-bottom: 15px; border-radius: 5px; background: var(--shell-block); }
      #startup-screen .shell-line-short { width: 34%; }
      #startup-screen .shell-search { height: 33px; margin: 22px 0; border-radius: 10px; background: var(--shell-block); }
      #startup-screen .shell-calendar { height: 160px; margin: 20px 0 28px; border-radius: 10px; background: var(--shell-block); opacity: 0.65; }
      #startup-screen .shell-sidebar .shell-line { margin-bottom: 27px; }
      #startup-screen .shell-main { flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 24px 150px; }
      #startup-screen .shell-mobile-header { display: none; }
      #startup-screen .shell-space { width: 108px; height: 24px; margin-bottom: 24px; border-radius: 7px; background: var(--shell-block); }
      #startup-screen .shell-editor, #startup-screen .shell-card {
        box-sizing: border-box;
        border: 1px solid var(--startup-edge);
        border-radius: 12px;
        background: var(--startup-paper);
        padding: 20px;
      }
      #startup-screen .shell-editor { height: 210px; margin-bottom: 12px; }
      #startup-screen .shell-editor .shell-line:last-child { width: 28%; margin-top: 120px; }
      #startup-screen .shell-card { height: 142px; margin-bottom: 12px; }
      #startup-screen .shell-card .shell-line:first-child { width: 20%; margin-bottom: 28px; }
      #startup-screen .shell-card .shell-line:last-child { width: 52%; }
      @media (max-width: 767px) {
        #startup-screen .shell-sidebar { display: none; }
        html[data-startup-mode="warm"] #startup-screen .startup-content { left: 64px; }
      }
      @media (max-width: 639px) {
        #startup-screen .shell-nav { display: none; }
        #startup-screen .shell-main { padding: 20px 16px 150px; }
        #startup-screen .shell-mobile-header { display: flex; justify-content: space-between; align-items: center; height: 26px; margin-bottom: 28px; }
        #startup-screen .shell-mobile-header span { height: 22px; width: 28px; border-radius: 6px; background: var(--shell-block); }
        #startup-screen .shell-mobile-header span:first-child { width: 100px; }
        #startup-screen .shell-space { margin-bottom: 20px; }
        #startup-screen .shell-editor { height: 200px; }
        #startup-screen .shell-editor .shell-line:last-child { margin-top: 110px; }
        #startup-screen .shell-card { height: 128px; }
        html[data-startup-mode="warm"] #startup-screen .startup-content { left: 0; }
      }
      @keyframes startup-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes startup-dot { 0%, 55%, 100% { transform: translateY(0); opacity: 0.35; } 27% { transform: translateY(-4px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #startup-screen .startup-papers, #startup-screen .startup-dot { animation: none; }
      }
    </style>
    <!-- memos.metadata.head -->
    <title>Memos</title>
  </head>
  <body class="text-base w-full min-h-svh">
    <div id="startup-screen">
      <div class="startup-shell" aria-hidden="true" inert>
        <div class="shell-nav"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="shell-sidebar">
          <span class="shell-line shell-line-short"></span>
          <div class="shell-search"></div>
          <div class="shell-calendar"></div>
          <span class="shell-line shell-line-short"></span>
          <span class="shell-line"></span><span class="shell-line"></span><span class="shell-line"></span><span class="shell-line"></span>
        </div>
        <div class="shell-main">
          <div class="shell-mobile-header"><span></span><span></span></div>
          <div class="shell-space"></div>
          <div class="shell-editor"><span class="shell-line shell-line-short"></span><span class="shell-line"></span></div>
          <div class="shell-card"><span class="shell-line"></span><span class="shell-line"></span><span class="shell-line"></span></div>
          <div class="shell-card"><span class="shell-line"></span><span class="shell-line"></span><span class="shell-line"></span></div>
        </div>
      </div>
      <div class="startup-content">
        <div class="startup-brand">
          <div class="startup-papers" aria-hidden="true">
            <div class="startup-paper"></div>
            <div class="startup-paper"></div>
            <div class="startup-paper">
              <img class="startup-logo" src="/logo.webp" width="54" height="54" alt="" />
              <span class="startup-line"></span>
              <span class="startup-line"></span>
            </div>
          </div>
          <p class="startup-title">Memos</p>
          <div class="startup-dots" aria-hidden="true">
            <span class="startup-dot"></span><span class="startup-dot"></span><span class="startup-dot"></span>
          </div>
        </div>
        <p id="startup-status" class="startup-status" role="status">正在打开 Memos…</p>
        <div id="startup-recovery" class="startup-recovery" hidden>
          <button id="startup-retry" class="startup-retry" type="button">重新加载</button>
        </div>
        <noscript>
          <style>.startup-dots { display: none !important; } #startup-status { display: none; }</style>
          <p>请启用 JavaScript 以打开 Memos。Please enable JavaScript to open Memos.</p>
        </noscript>
      </div>
    </div>
    <div id="root" class="relative w-full min-h-full" inert aria-hidden="true"></div>
    <script id="startup-script">
      (() => {
        const screen = document.getElementById("startup-screen");
        const root = document.getElementById("root");
        const status = document.getElementById("startup-status");
        const recovery = document.getElementById("startup-recovery");
        const retry = document.getElementById("startup-retry");
        let locale = navigator.language;
        let previousBuild = null;
        try {
          locale = localStorage.getItem("memos-locale") || locale;
          previousBuild = localStorage.getItem("memos-successful-build");
        } catch {
          // Startup also works when browser storage is unavailable.
        }
        const chinese = locale.toLowerCase().startsWith("zh");
        status.textContent = chinese ? "正在打开 Memos…" : "Opening Memos…";
        retry.textContent = chinese ? "重新加载" : "Reload";
        retry.addEventListener("click", () => window.location.reload());

        const buildId = document.querySelector('meta[name="memos-build-id"]').content;
        const warm = document.documentElement.dataset.startupMode === "warm";
        let shellReady = false;
        let pageReady = false;
        let pageSucceeded = false;
        let dismissed = false;
        let stylesFailed = false;
        const styles = Array.from(document.querySelectorAll("link[data-startup-stylesheet]"));
        let remainingStyles = styles.length;
        const showRecovery = () => {
          status.textContent = chinese ? "加载时间较长，请检查网络或重新加载。" : "This is taking longer than usual. Check your connection or reload.";
          recovery.hidden = false;
        };
        const timeout = window.setTimeout(showRecovery, 12000);
        const finish = () => {
          if (remainingStyles || stylesFailed) return;
          if (pageReady) {
            if (pageSucceeded && /^[a-f0-9]{64}$/.test(buildId)) {
              try {
                const currentBuild = localStorage.getItem("memos-successful-build");
                // Do not overwrite a newer build completed by another open window.
                if (currentBuild === previousBuild || currentBuild === buildId) localStorage.setItem("memos-successful-build", buildId);
              } catch {
                // A blocked or full store must never block a successful launch.
              }
            }
            window.removeEventListener("memos:startup-ready", onPageReady);
            window.removeEventListener("memos:startup-shell-ready", onShellReady);
          }
          if (dismissed || (!pageReady && !(warm && shellReady))) return;
          dismissed = true;
          window.clearTimeout(timeout);
          root.removeAttribute("inert");
          root.removeAttribute("aria-hidden");
          screen.remove();
          document.getElementById("startup-style")?.remove();
        };
        function onPageReady(event) {
          pageReady = true;
          pageSucceeded = event.detail?.success !== false;
          finish();
        }
        function onShellReady() {
          shellReady = true;
          finish();
        }
        window.addEventListener("memos:startup-ready", onPageReady);
        window.addEventListener("memos:startup-shell-ready", onShellReady);
        for (const link of styles) {
          link.addEventListener("load", () => {
            link.media = "all";
            remainingStyles -= 1;
            finish();
          }, { once: true });
          link.addEventListener("error", () => {
            stylesFailed = true;
            showRecovery();
          }, { once: true });
          // Download the application's styles without blocking the inline startup screen.
          link.media = "print";
          link.rel = "stylesheet";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- memos.metadata.body -->
  </body>
</html>
